<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snappy E-Commerce</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🛍️ Snappy Store</h1>
    <p>Find your favorite products</p>
  </header>

  <nav id="category-tabs" class="tabs" id="category-list"></nav>

  <main>
    <div id="items-container" class="grid" id="item-list"></div>
    <label for="item-count">item-count:</label>

<select name="ID" id=item-count">
  <option value="all">all</option>
  <option value="10">Ten</option>
  <option value="50">Fifty</option>
  <option value="100">hundred</option>
</select>
  </main>

  <footer>
    <p>© 2025 Snappy Store. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
