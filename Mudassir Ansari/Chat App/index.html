<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Chat App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>💬 History</h2>
      <ul id="historyList"></ul>
    </aside>

    <!-- Main Chat Interface -->
    <main class="main-chat">
      <h1>💭 LLM Chat App</h1>

      <div class="controls">
        <select id="modelSelector">
          <option value="mistralai/mistral-7b-instruct">Mistral</option>
          <option value="meta-llama/llama-3-8b-instruct">LLaMA 3</option>
          <option value="google/gemini-2.5-flash-lite-preview-06-17">gemini-2</option> <option value="moonshotai/kimi-dev-72b:free">kimi</option>
          <option value="minimax/minimax-m1:extended">minimax</option><option value="qwen/qwen3-32b-04-28:free">qwen</option>
        </select>
        <input type="password" id="apiKey" placeholder="Enter your OpenRouter API key" />
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message here..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
